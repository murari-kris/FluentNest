<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pronunciation Practice | FluentNest</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

    /* 1. Global Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: #EDE3F8;
      color: #2E1065;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px 0;
    }

    /* 2. Responsive Container */
    .container {
      width: 92%; 
      max-width: 800px; 
      margin: auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(74, 23, 128, 0.1);
      padding: clamp(30px, 8vw, 60px) clamp(20px, 5vw, 40px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Decorative element to match the 'Academy' feel */
    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #4A1780, #8E4DD8);
    }

    h1 {
      color: #4A1780;
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      margin-bottom: 20px;
      font-weight: 600;
      line-height: 1.2;
    }

    p {
      font-size: clamp(1rem, 4vw, 1.15rem);
      line-height: 1.6;
      margin-bottom: 40px;
      color: #4B5563;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 3. Button Layout (Adaptive Flex) */
    .btn-container {
      display: flex;
      flex-direction: column; 
      gap: 15px;
    }

    .btn {
      background: #8E4DD8;
      color: #fff;
      text-decoration: none;
      padding: 18px 30px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover {
      background: #4A1780;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(74, 23, 128, 0.2);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    /* 4. Layout Adjustments for Tablet/Desktop */
    @media (min-width: 600px) {
      .btn-container {
        flex-direction: row; 
        justify-content: center;
        gap: 20px;
      }

      .btn {
        width: auto;
        min-width: 200px;
      }
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #6B7280;
      font-size: 0.85rem;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pronunciation Practice</h1>
    <p>
      Master the sounds of English through phonetic exercises and repeat-after-me training. 
      Improve your accent and speak with native-like clarity.
    </p>

    <div class="btn-container">
      <a th:href="@{/words}" id="practiceBtn" class="btn">
        <span class="icon">🔊</span> Practice Words
      </a>
      <a th:href="@{/listen}" id="listenBtn" class="btn">
        <span class="icon">🎧</span> Listen & Repeat
      </a>
    </div>
  </div>

  <footer>© 2026 FluentNest — Pronunciation Lab</footer>

  <script th:inline="javascript">
    // Added ripple effect console logs for interaction testing
    const practiceBtn = document.getElementById("practiceBtn");
    const listenBtn = document.getElementById("listenBtn");

    if (practiceBtn) {
      practiceBtn.onclick = () => console.log("Entering Word Practice Mode...");
    }

    if (listenBtn) {
      listenBtn.onclick = () => console.log("Entering Listening Training Mode...");
    }
  </script>
</body>
</html>
