<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FluentNest | Video Practice</title>
    <style>
        :root {
            --green: #2ecc71;
            --red: #e74c3c;
            --blue: #3498db;
            --bg: #0b0b0b;
            --panel: #1a1a1a;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); overflow: hidden; font-family: sans-serif;
        }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 1000;
        }

        #container { display: none; flex-direction: column; width: 100vw; height: 100%; }

        #videoArea {
            height: 40vh; position: relative; background: #000;
            display: flex; flex-direction: row;
        }

        video {
            width: 50%; height: 100%; object-fit: cover;
            background: #222; border: 1px solid #111;
        }

        #chatArea {
            flex: 1; display: flex; flex-direction: column;
            background: var(--panel); border-top: 2px solid #333; overflow: hidden;
        }

        #messages {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .bubble {
            padding: 10px 14px; border-radius: 18px; max-width: 80%;
            font-size: 15px; word-wrap: break-word; line-height: 1.4;
        }
        .me { align-self: flex-end; background: var(--green); color: white; border-bottom-right-radius: 2px; }
        .them { align-self: flex-start; background: #333; color: white; border-bottom-left-radius: 2px; }

        #inputBox { padding: 12px; background: #111; display: flex; gap: 10px; }

        input {
            flex: 1; padding: 12px; border-radius: 25px; border: none;
            background: #222; color: #fff; outline: none; font-size: 16px;
        }

        .send-btn {
            background: var(--blue); border: none; color: white;
            padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer;
        }

        .controls {
            position: absolute; bottom: 15px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 15px; z-index: 10;
        }

        .circle-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.15); color: white;
            backdrop-filter: blur(8px); cursor: pointer; font-size: 1.2rem;
            transition: 0.2s;
        }
        .circle-btn:active { transform: scale(0.9); }

        .volume-meter {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 4px;
            background: rgba(255,255,255,0.1);
        }
        #volumeBar { height: 100%; width: 0%; background: var(--green); transition: width 0.1s; }

        @media (min-width: 900px) {
            #container { flex-direction: row; }
            #videoArea { height: 100%; flex: 3; flex-direction: column; }
            video { width: 100%; height: 50%; }
            #chatArea { flex: 1; border-top: none; border-left: 2px solid #333; }
        }
    </style>
</head>
<body>

    <div id="lobby" class="overlay">
        <h2 style="color: white; margin-bottom: 20px;">Ready for Practice?</h2>
        <button onclick="startApp()" style="padding: 16px 45px; border-radius: 50px; border: none; background: var(--green); color: white; font-weight: bold; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);">
            Start Video Chat
        </button>
    </div>

    <div id="container">
        <div id="videoArea">
            <video id="localVideo" autoplay muted playsinline></video>
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="volume-meter"><div id="volumeBar"></div></div>
            <div class="controls">
                <button class="circle-btn" id="mBtn" onclick="toggleMic()">🎤</button>
                <button class="circle-btn" id="vBtn" onclick="toggleVid()">📹</button>
                <button class="circle-btn" style="background: var(--red)" onclick="location.reload()">🛑</button>
            </div>
        </div>
        <div id="chatArea">
            <div id="messages"></div>
            <div id="inputBox">
                <input type="text" id="chatInp" placeholder="Type a message..." autocomplete="off" onkeypress="if(event.key==='Enter') sendChat()">
                <button class="send-btn" onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

<script th:inline="javascript">
    let pc, localStream, socket, isCaller = false;
    let candidateQueue = [];

 // This automatically detects if you are on Render (https) or Localhost (http)
    const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const host = window.location.host; // This will be 'fluentnest-w6wl.onrender.com'
 // Change this line to match your Java "/ws" mapping
    const socketUrl = `${protocol}${host}/ws`; 

    console.log("Connecting to: " + socketUrl);
    socket = new WebSocket(socketUrl);
    
    // Robust ICE Configuration with your new Metered.ca Credentials
    const rtcConfig = {
        iceServers: [
            { urls: "stun:global.relay.metered.ca:80" }, 
            {
                urls: "turn:global.relay.metered.ca:80",
                username: "6af35a1cd09352e783afbf32",
                credential: "CKbwyCRM/3ArXR8X"
            },
            {
                urls: "turn:global.relay.metered.ca:443",
                username: "6af35a1cd09352e783afbf32",
                credential: "CKbwyCRM/3ArXR8X"
            },
            {
                urls: "turn:global.relay.metered.ca:443?transport=tcp",
                username: "6af35a1cd09352e783afbf32",
                credential: "CKbwyCRM/3ArXR8X"
            }
        ],
        iceCandidatePoolSize: 10
    };

    async function startApp() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: true, 
                audio: { echoCancellation: true, noiseSuppression: true } 
            });
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('container').style.display = 'flex';
            
            // Signal to server that we are ready
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'find_partner' }));
            }
        } catch (e) { 
            console.error(e);
            alert("Camera/Mic access is required to join the practice session."); 
        }
    }

    function initWebRTC() {
        pc = new RTCPeerConnection(rtcConfig);
        
        // Add local tracks to the connection
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

        // When remote video arrives
        pc.ontrack = e => {
            const rv = document.getElementById('remoteVideo');
            if (rv.srcObject !== e.streams[0]) {
                rv.srcObject = e.streams[0];
                startVolumeMeter(e.streams[0]);
            }
        };

        // Send our network info (ICE) to the partner
        pc.onicecandidate = e => {
            if (e.candidate && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'ice', candidate: e.candidate }));
            }
        };

        if (isCaller) {
            pc.onnegotiationneeded = async () => {
                try {
                    if (pc.signalingState !== "stable") return;
                    const off = await pc.createOffer();
                    await pc.setLocalDescription(off);
                    socket.send(JSON.stringify({ type: 'offer', sdp: off }));
                } catch (err) { console.error(err); }
            };
        }
    }

    socket.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);
        
        switch(data.type) {
            case 'match_found':
                isCaller = true;
                initWebRTC();
                break;
                
            case 'offer':
                if (!pc) initWebRTC();
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const ans = await pc.createAnswer();
                await pc.setLocalDescription(ans);
                socket.send(JSON.stringify({ type: 'answer', sdp: ans }));
                processQueue();
                break;
                
            case 'answer':
                if (pc) {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    processQueue();
                }
                break;
                
            case 'ice':
                const cand = new RTCIceCandidate(data.candidate);
                // Queue candidates if description isn't set yet (vital for Mobile Data)
                if (!pc || !pc.remoteDescription || !pc.remoteDescription.type) {
                    candidateQueue.push(cand);
                } else {
                    pc.addIceCandidate(cand).catch(e => {});
                }
                break;
                
            case 'chat':
                appendUI(data.text, 'them');
                break;
                
            case 'partner_left':
                alert("Your partner has disconnected.");
                location.reload();
                break;
        }
    };

    function processQueue() {
        while (candidateQueue.length > 0) {
            pc.addIceCandidate(candidateQueue.shift()).catch(e => {});
        }
    }

    function sendChat() {
        const inp = document.getElementById('chatInp');
        const text = inp.value.trim();
        if (!text || socket.readyState !== WebSocket.OPEN) return;
        socket.send(JSON.stringify({ type: 'chat', text: text }));
        appendUI(text, 'me');
        inp.value = '';
    }

    function appendUI(txt, side) {
        const div = document.createElement('div');
        div.className = `bubble ${side}`;
        div.innerText = txt;
        const box = document.getElementById('messages');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        t.enabled = !t.enabled;
        document.getElementById('mBtn').innerText = t.enabled ? '🎤' : '🔇';
    }

    function toggleVid() {
        const t = localStream.getVideoTracks()[0];
        t.enabled = !t.enabled;
        document.getElementById('vBtn').innerText = t.enabled ? '📹' : '❌';
    }

    function startVolumeMeter(stream) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const src = ctx.createMediaStreamSource(stream);
            const ans = ctx.createAnalyser();
            ans.fftSize = 256;
            src.connect(ans);
            const data = new Uint8Array(ans.frequencyBinCount);
            const bar = document.getElementById('volumeBar');
            function update() {
                ans.getByteFrequencyData(data);
                let sum = data.reduce((a, b) => a + b, 0);
                bar.style.width = Math.min((sum / data.length) * 3, 100) + "%";
                requestAnimationFrame(update);
            }
            update();
        } catch (e) { console.warn("Audio meter failed"); }
    }
</script>
</body>
</html>
