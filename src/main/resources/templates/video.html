<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FluentNest | Video Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent:  #00f5a0;
            --accent2: #00d9f5;
            --red:     #ff4d6d;
            --bg:      #080c10;
            --panel:   #0e1318;
            --border:  rgba(255,255,255,0.07);
            --glass:   rgba(255,255,255,0.04);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            color: white;
            /* No position:fixed here — it prevents Android/Redmi
               from resizing the viewport when the soft keyboard opens,
               which permanently hides the input box under the keyboard. */
            overflow: hidden;
        }

        /* ══════════════════ LOBBY ══════════════════ */
        #lobby {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at 60% 30%, #00f5a015 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, #00d9f510 0%, transparent 50%),
                var(--bg);
        }

        .lobby-card {
            text-align: center;
            padding: 48px 36px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 28px;
            backdrop-filter: blur(20px);
            max-width: 440px;
            width: 90%;
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 24px;
            opacity: 0.8;
        }

        .lobby-title {
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            font-weight: 600;
            line-height: 1.15;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 40%, #ffffff80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lobby-sub {
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        #startBtn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 15px 38px;
            border-radius: 50px; border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #080c10;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 30px rgba(0,245,160,0.3);
            -webkit-tap-highlight-color: transparent;
        }
        #startBtn:hover  { transform: translateY(-2px); box-shadow: 0 0 45px rgba(0,245,160,0.45); }
        #startBtn:active { transform: scale(0.96); }
        #startBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .features { display: flex; gap: 20px; justify-content: center; margin-top: 28px; }
        .feat {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.04em;
        }
        .feat-icon { font-size: 1.3rem; }

        /* ══════════════════ STATUS OVERLAY ══════════════════ */
        #statusOverlay {
            display: none;
            position: fixed; inset: 0; z-index: 500;
            background: rgba(8,12,16,0.88);
            backdrop-filter: blur(8px);
            align-items: center; justify-content: center;
            flex-direction: column; gap: 18px;
        }

        .spinner {
            width: 46px; height: 46px;
            border: 3px solid rgba(0,245,160,0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #statusText {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            color: var(--accent);
        }

        /* ══════════════════ MAIN CONTAINER ══════════════════ */
        #container {
            display: none;
            flex-direction: column;
            width: 100%;
            /* 
              Android Chrome (Redmi/MIUI): When keyboard opens, 
              100vh does NOT shrink — it stays at full screen height,
              burying the input. We use --vh set by JS on resize.
              Falls back to 100dvh (Chrome 108+) then 100vh.
            */
            height: calc(var(--vh, 1vh) * 100);
        }

        /* ══════════════════ VIDEO PANEL ══════════════════ */
        #videoArea {
            position: relative;
            background: #000;
            flex: 0 0 38vh;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        video {
            width: 50%; height: 100%;
            object-fit: cover;
            background: #050810;
        }
        #localVideo { border-right: 1px solid var(--border); }

        /* ── Mobile: PiP local video, full remote ── */
        @media (max-width: 599px) {
            #videoArea { flex: 0 0 30vh; }

            #remoteVideo { width: 100%; }

            #localVideo {
                position: absolute;
                bottom: 58px; left: 8px;
                width: 26%; height: auto;
                aspect-ratio: 4/3;
                border-radius: 10px;
                border: 2px solid rgba(255,255,255,0.25);
                z-index: 5;
                object-fit: cover;
            }

            #remotePlaceholder { left: 0; width: 100%; }
            .vid-label.local  { left: 8px; bottom: 44px; top: auto; font-size: 0.52rem; }
            .vid-label.remote { left: 10px; top: 8px; }
        }

        .vid-label {
            position: absolute; top: 10px;
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            border: 1px solid var(--border);
            color: rgba(255,255,255,0.55);
            pointer-events: none;
        }
        .vid-label.local  { left: 10px; }
        .vid-label.remote { left: calc(50% + 10px); }

        #connBadge {
            position: absolute; top: 10px; right: 10px;
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            letter-spacing: 0.08em;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border);
            color: rgba(255,255,255,0.4);
            transition: color 0.3s, border-color 0.3s;
            pointer-events: none;
        }
        #connBadge.connected { color: var(--accent); border-color: rgba(0,245,160,0.5); }
        #connBadge.failed    { color: var(--red);    border-color: rgba(255,77,109,0.5); }

        #remotePlaceholder {
            position: absolute; left: 50%; top: 0;
            width: 50%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px;
            background: #050810;
            pointer-events: none;
        }
        #remotePlaceholder .ph-icon { font-size: 2.5rem; opacity: 0.15; }
        #remotePlaceholder p { font-size: 0.75rem; color: rgba(255,255,255,0.2); }

        .controls {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 10;
        }

        .circle-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.65);
            color: white;
            backdrop-filter: blur(12px);
            cursor: pointer;
            font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .circle-btn:active { transform: scale(0.88); }
        .circle-btn.muted  { background: rgba(255,77,109,0.2); border-color: rgba(255,77,109,0.5); }
        .circle-btn.end    { background: rgba(255,77,109,0.2); border-color: rgba(255,77,109,0.5); }

        .volume-meter {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 3px;
            background: rgba(255,255,255,0.04);
        }
        #volumeBar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.08s;
        }

        /* ══════════════════ CHAT PANEL ══════════════════ */
        #chatArea {
            flex: 1 1 0;          /* fill ALL remaining height */
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border-top: 1px solid var(--border);
            min-height: 0;        /* critical for flex scroll child */
            overflow: hidden;
        }

        .chat-header {
            flex-shrink: 0;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-family: 'Space Mono', monospace;
            font-size: 0.62rem;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.28);
            text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
        }

        .chat-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 7px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

        /* ── Message list: scrollable, takes remaining space ── */
        #messages {
            flex: 1 1 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            min-height: 0;
        }
        #messages::-webkit-scrollbar { width: 3px; }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

        .bubble {
            padding: 9px 13px;
            border-radius: 16px;
            max-width: 82%;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
        }
        .me {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(0,179,119,0.25), rgba(0,196,208,0.2));
            border: 1px solid rgba(0,245,160,0.18);
            border-bottom-right-radius: 3px;
            color: rgba(255,255,255,0.9);
        }
        .them {
            align-self: flex-start;
            background: rgba(255,255,255,0.055);
            border: 1px solid var(--border);
            border-bottom-left-radius: 3px;
            color: rgba(255,255,255,0.85);
        }
        .sys-msg {
            align-self: center;
            font-size: 0.68rem;
            color: rgba(255,255,255,0.28);
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.04em;
            padding: 3px 10px;
            text-align: center;
        }

        /* ── Input row: always visible above Android keyboard ── */
        #inputBox {
            flex-shrink: 0;
            padding: 10px 10px;
            /* Extra bottom padding for phones with home bar (iPhone/some Android) */
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: #06080c;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: center;
            /* sticky keeps it anchored when keyboard pushes up on Android */
            position: sticky;
            bottom: 0;
            /* Ensure it's always above everything */
            z-index: 20;
        }

        #chatInp {
            flex: 1;
            padding: 11px 14px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.045);
            color: #fff;
            outline: none;
            /* 16px stops iOS Safari from auto-zooming the page */
            font-size: 16px;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        #chatInp:focus { border-color: rgba(0,245,160,0.35); }
        #chatInp::placeholder { color: rgba(255,255,255,0.22); }

        .send-btn {
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none; color: #080c10;
            padding: 11px 16px;
            border-radius: 50px;
            font-family: 'Space Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s, transform 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .send-btn:active { transform: scale(0.93); opacity: 0.85; }

        /* ══════════════════ DESKTOP ≥ 900px ══════════════════ */
        @media (min-width: 900px) {
            #container { flex-direction: row; height: calc(var(--vh, 1vh) * 100); }

            #videoArea {
                flex: 3 1 0;
                height: 100%;
                flex-direction: column;
            }

            /* reset mobile PiP */
            #remoteVideo {
                width: 100%; height: 50%;
                position: static;
            }
            #localVideo {
                position: static;
                width: 100%; height: 50%;
                border-radius: 0;
                aspect-ratio: unset;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .vid-label.remote { left: 12px; top: calc(50% + 12px); }
            .vid-label.local  { left: 12px; top: 12px; }

            #remotePlaceholder { left: 0; top: 50%; width: 100%; height: 50%; }

            #chatArea {
                flex: 1 1 0;
                border-top: none;
                border-left: 1px solid var(--border);
                height: 100%;
            }
        }
    </style>
</head>
<body>

<!-- ═══ LOBBY ═══ -->
<div id="lobby">
    <div class="lobby-card">
        <div class="logo">FluentNest</div>
        <h1 class="lobby-title">Speak with Strangers.<br>Grow Together.</h1>
        <p class="lobby-sub">Get matched with a random partner worldwide and practice English through real conversation.</p>
        <button id="startBtn" onclick="startApp()">▶ &nbsp;Start Practice</button>
        <div class="features">
            <div class="feat"><span class="feat-icon">🎙️</span>Voice + Video</div>
            <div class="feat"><span class="feat-icon">💬</span>Live Chat</div>
            <div class="feat"><span class="feat-icon">🌍</span>Worldwide</div>
        </div>
    </div>
</div>

<!-- ═══ STATUS OVERLAY ═══ -->
<div id="statusOverlay">
    <div class="spinner"></div>
    <div id="statusText">SEARCHING FOR PARTNER…</div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div id="container">

    <div id="videoArea">
        <video id="localVideo"  autoplay muted    playsinline></video>
        <video id="remoteVideo" autoplay          playsinline></video>

        <div id="remotePlaceholder">
            <div class="ph-icon">👤</div>
            <p>Waiting for partner…</p>
        </div>

        <span class="vid-label local">You</span>
        <span class="vid-label remote">Partner</span>
        <span id="connBadge">⬤ CONNECTING</span>

        <div class="volume-meter"><div id="volumeBar"></div></div>

        <div class="controls">
            <button class="circle-btn" id="mBtn" onclick="toggleMic()">🎤</button>
            <button class="circle-btn" id="vBtn" onclick="toggleVid()">📹</button>
            <button class="circle-btn end" onclick="location.reload()">🛑</button>
        </div>
    </div>

    <div id="chatArea">
        <div class="chat-header">
            <div class="chat-dot"></div>
            Live Chat
        </div>
        <div id="messages"></div>
        <div id="inputBox">
            <input
                type="text"
                id="chatInp"
                placeholder="Type a message…"
                autocomplete="off"
                enterkeyhint="send"
                onkeypress="if(event.key==='Enter') sendChat()"
            >
            <button class="send-btn" onclick="sendChat()">Send</button>
        </div>
    </div>

</div>

<script th:inline="javascript">
/* ════════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════════ */
let pc, localStream, socket;
let isCaller       = false;
let candidateQueue = [];
let offerSent      = false;

/* ════════════════════════════════════════════════════════
   ICE / STUN / TURN CONFIG
   ────────────────────────────────────────────────────────
   THREE candidate types — all needed for every scenario:

   ① host  → LAN IP   Works on same WiFi with NO servers
   ② srflx → public IP via STUN. Works across home routers.
   ③ relay → traffic routed through TURN. Required when:
              - One user is on mobile data (4G/5G)
              - Corporate / university firewall
              - Carrier-grade NAT (many ISPs in India, etc.)

   Without relay, mobile ↔ WiFi ALWAYS fails.
   iceTransportPolicy must stay 'all' (never 'relay') so
   same-network still uses the faster host path.
════════════════════════════════════════════════════════ */
const ICE = {
    iceServers: [
        /* STUN — public IP discovery */
        { urls: 'stun:stun.l.google.com:19302'  },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },

        /* TURN — OpenRelay (always free, no sign-up) */
        {
            urls:       'turn:openrelay.metered.ca:80',
            username:   'openrelayproject',
            credential: 'openrelayproject'
        },
        {
            urls:       'turn:openrelay.metered.ca:80?transport=tcp',
            username:   'openrelayproject',
            credential: 'openrelayproject'
        },
        {
            urls:       'turn:openrelay.metered.ca:443',
            username:   'openrelayproject',
            credential: 'openrelayproject'
        },
        {
            urls:       'turn:openrelay.metered.ca:443?transport=tcp',
            username:   'openrelayproject',
            credential: 'openrelayproject'
        },

        /* TURN — Numb/Viagenie (free public fallback) */
        {
            urls:       'turn:numb.viagenie.ca',
            username:   'webrtc@live.com',
            credential: 'muazkh'
        },
        {
            urls:       'turn:numb.viagenie.ca?transport=tcp',
            username:   'webrtc@live.com',
            credential: 'muazkh'
        }
    ],
    iceTransportPolicy:  'all',     /* MUST be 'all' — never 'relay' */
    iceCandidatePoolSize: 10,       /* pre-gather candidates early    */
    bundlePolicy:        'max-bundle',
    rtcpMuxPolicy:       'require'
};

/* ════════════════════════════════════════════════════════
   WEBSOCKET — auto-reconnects on drop
════════════════════════════════════════════════════════ */
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
console.log('[WS] connecting →', WS_URL);

function createSocket() {
    const ws = new WebSocket(WS_URL);
    ws.onopen    = () => console.log('[WS] open');
    ws.onerror   = e  => console.error('[WS] error', e);
    ws.onclose   = ()  => {
        console.warn('[WS] closed — retry in 3 s');
        setTimeout(() => { socket = createSocket(); }, 3000);
    };
    ws.onmessage = onSignal;
    return ws;
}
socket = createSocket();

/* ════════════════════════════════════════════════════════
   SIGNALING HANDLER
════════════════════════════════════════════════════════ */
async function onSignal(ev) {
    let d;
    try { d = JSON.parse(ev.data); } catch { return; }
    console.log('[SIG] ←', d.type);

    switch (d.type) {

        case 'match_found':
            /* We are the CALLER */
            isCaller = true; offerSent = false;
            hideStatus();
            appendSys('Partner found — establishing connection…');
            initWebRTC();
            /* Delay 500 ms so callee's initWebRTC() has run.
               Without this, same-network offer arrives before
               callee is ready → silent failure.               */
            setTimeout(doOffer, 500);
            break;

        case 'matched':
            /* We are the CALLEE */
            isCaller = false;
            hideStatus();
            appendSys('Partner found — waiting for connection…');
            initWebRTC();
            break;

        case 'offer':
            if (!pc) initWebRTC();
            try {
                await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));
                const ans = await pc.createAnswer();
                await pc.setLocalDescription(ans);
                wsSend({ type: 'answer', sdp: pc.localDescription });
                drainQueue();
            } catch(e) { console.error('[offer]', e); }
            break;

        case 'answer':
            if (pc && pc.signalingState === 'have-local-offer') {
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));
                    drainQueue();
                } catch(e) { console.error('[answer]', e); }
            }
            break;

        case 'ice':
            if (!d.candidate) return;
            const c = new RTCIceCandidate(d.candidate);
            if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                pc.addIceCandidate(c).catch(e => console.warn('[ICE add]', e));
            } else {
                /* Queue until remote description arrives */
                candidateQueue.push(c);
            }
            break;

        case 'chat':
            appendMsg(d.text, 'them');
            break;

        case 'partner_left':
            appendSys('Partner disconnected.');
            badge('failed', '⬤ OFFLINE');
            document.getElementById('remotePlaceholder').style.display = 'flex';
            if (pc) { pc.close(); pc = null; }
            break;
    }
}

/* ════════════════════════════════════════════════════════
   START APP
════════════════════════════════════════════════════════ */
async function startApp() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    btn.textContent = 'Starting…';

    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
    } catch(e) {
        alert('Camera/microphone access required.\nPlease allow permission and reload.');
        btn.disabled = false;
        btn.textContent = '▶  Start Practice';
        return;
    }

    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('lobby').style.display  = 'none';
    document.getElementById('container').style.display = 'flex';
    showStatus('SEARCHING FOR PARTNER…');

    const find = () => wsSend({ type: 'find_partner' });
    socket.readyState === WebSocket.OPEN
        ? find()
        : socket.addEventListener('open', find, { once: true });
}

/* ════════════════════════════════════════════════════════
   WEBRTC SETUP
════════════════════════════════════════════════════════ */
function initWebRTC() {
    if (pc) pc.close();
    pc = new RTCPeerConnection(ICE);

    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    pc.ontrack = ({ streams }) => {
        const rv = document.getElementById('remoteVideo');
        if (rv.srcObject !== streams[0]) {
            rv.srcObject = streams[0];
            document.getElementById('remotePlaceholder').style.display = 'none';
            startVolumeMeter(streams[0]);
            appendSys('✓ Video connected');
        }
    };

    /* Send ICE candidates to partner via WebSocket */
    pc.onicecandidate = ({ candidate }) => {
        if (candidate) wsSend({ type: 'ice', candidate });
    };

    pc.onicegatheringstatechange = () =>
        console.log('[ICE gather]', pc.iceGatheringState);

    /* Connection state → update badge */
    pc.oniceconnectionstatechange = () => {
        const s = pc.iceConnectionState;
        console.log('[ICE conn]', s);
        switch (s) {
            case 'checking':
                badge('', '⬤ CHECKING'); break;
            case 'connected':
            case 'completed':
                badge('connected', '⬤ CONNECTED'); break;
            case 'disconnected':
                badge('', '⬤ RECONNECTING');
                appendSys('Connection interrupted, recovering…');
                break;
            case 'failed':
                badge('failed', '⬤ FAILED');
                appendSys('Connection failed — retrying with relay…');
                /* ICE restart forces TURN relay path — fixes
                   mobile data ↔ WiFi failures automatically.  */
                if (isCaller && pc) {
                    offerSent = false;
                    pc.restartIce();
                    doOffer(true); /* iceRestart: true */
                }
                break;
            case 'closed':
                badge('failed', '⬤ CLOSED'); break;
        }
    };

    console.log('[RTC] peer created, isCaller:', isCaller);
}

async function doOffer(restart = false) {
    if (!pc || pc.signalingState === 'closed') return;
    if (offerSent && !restart) return; /* send only once unless restarting */
    try {
        const offer = await pc.createOffer({
            offerToReceiveAudio: true,
            offerToReceiveVideo: true,
            iceRestart: restart
        });
        if (pc.signalingState === 'closed') return;
        await pc.setLocalDescription(offer);
        wsSend({ type: 'offer', sdp: pc.localDescription });
        offerSent = true;
        console.log('[OFFER] sent, restart=', restart);
    } catch(e) { console.error('[doOffer]', e); }
}

/* ════════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════════ */
function wsSend(obj) {
    if (socket && socket.readyState === WebSocket.OPEN)
        socket.send(JSON.stringify(obj));
}

function drainQueue() {
    while (candidateQueue.length)
        pc.addIceCandidate(candidateQueue.shift()).catch(() => {});
}

function sendChat() {
    const inp  = document.getElementById('chatInp');
    const text = inp.value.trim();
    if (!text) return;
    wsSend({ type: 'chat', text });
    appendMsg(text, 'me');
    inp.value = '';
    inp.focus(); /* keep keyboard open on mobile */
}

function appendMsg(txt, side) {
    const d = document.createElement('div');
    d.className   = `bubble ${side}`;
    d.textContent = txt;
    const box = document.getElementById('messages');
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
}

function appendSys(txt) {
    const d = document.createElement('div');
    d.className   = 'sys-msg';
    d.textContent = txt;
    const box = document.getElementById('messages');
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
}

function badge(cls, label) {
    const b = document.getElementById('connBadge');
    b.className   = cls;
    b.textContent = label;
}

function showStatus(t) {
    document.getElementById('statusText').textContent = t;
    document.getElementById('statusOverlay').style.display = 'flex';
}
function hideStatus() {
    document.getElementById('statusOverlay').style.display = 'none';
}

/* ════════════════════════════════════════════════════════
   MEDIA CONTROLS
════════════════════════════════════════════════════════ */
function toggleMic() {
    if (!localStream) return;
    const t = localStream.getAudioTracks()[0];
    t.enabled = !t.enabled;
    const b = document.getElementById('mBtn');
    b.textContent = t.enabled ? '🎤' : '🔇';
    b.classList.toggle('muted', !t.enabled);
}

function toggleVid() {
    if (!localStream) return;
    const t = localStream.getVideoTracks()[0];
    t.enabled = !t.enabled;
    const b = document.getElementById('vBtn');
    b.textContent = t.enabled ? '📹' : '❌';
    b.classList.toggle('muted', !t.enabled);
}

/* ════════════════════════════════════════════════════════
   VOLUME METER  (partner's speaking level)
════════════════════════════════════════════════════════ */
function startVolumeMeter(stream) {
    try {
        const ctx      = new (window.AudioContext || window.webkitAudioContext)();
        const src      = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);
        const buf = new Uint8Array(analyser.frequencyBinCount);
        const bar = document.getElementById('volumeBar');
        (function tick() {
            analyser.getByteFrequencyData(buf);
            const avg = buf.reduce((a, b) => a + b, 0) / buf.length;
            bar.style.width = Math.min(avg * 3, 100) + '%';
            requestAnimationFrame(tick);
        })();
    } catch(e) { console.warn('[VolumeMeter]', e); }
}

/* ════════════════════════════════════════════════════════
   ANDROID / REDMI KEYBOARD FIX
   ────────────────────────────────────────────────────────
   Problem on Redmi (MIUI) + most Android Chrome:
   - window.innerHeight does NOT update when keyboard opens
   - 100vh is calculated at page load and stays FIXED
   - So the container keeps its original full height and the
     input box gets pushed below the keyboard — invisible!

   Solution: Use window.visualViewport which DOES update
   in real-time as the keyboard appears/disappears.
   We set a --vh CSS variable that the container uses
   instead of vh units, so layout always fits visible area.
════════════════════════════════════════════════════════ */
function setVH() {
    // visualViewport.height = visible area ABOVE the keyboard
    const h = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;
    document.documentElement.style.setProperty('--vh', h * 0.01 + 'px');
}

// Set immediately and on every keyboard open/close/resize
setVH();
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setVH);
    window.visualViewport.addEventListener('scroll', setVH);
}
window.addEventListener('resize', setVH);

// Also scroll messages to bottom when keyboard opens
document.getElementById('chatInp').addEventListener('focus', () => {
    setTimeout(() => {
        setVH(); // recalculate height now keyboard is open
        const box = document.getElementById('messages');
        box.scrollTop = box.scrollHeight;
        // On Redmi: explicitly scroll input into view
        document.getElementById('inputBox').scrollIntoView({ behavior: 'smooth', block: 'end' });
    }, 300);
});

document.getElementById('chatInp').addEventListener('blur', () => {
    setTimeout(setVH, 300); // restore when keyboard closes
});
</script>
