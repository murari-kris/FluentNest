<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join FluentNest | Master English</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #4EB5A9 0%, #0a001a 50%, #6157E1 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
            animation: slideUp 0.7s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signup-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .brand-header {
            margin-bottom: 35px;
        }

        .brand-header h2 {
            font-size: 1.2rem;
            margin: 0;
            font-weight: 400;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .logo-text {
            background: linear-gradient(to right, #ff0080, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 2.4rem;
            display: block;
            margin-top: 5px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            margin: 12px 0;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.07);
            color: white;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input[type="text"]::placeholder, input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #6157E1;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(97, 87, 225, 0.3);
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #4EB5A9, #6157E1);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(78, 181, 169, 0.4);
            filter: brightness(1.1);
        }

        .login-link {
            margin-top: 25px;
            display: inline-block;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .login-link b {
            color: #4EB5A9;
            transition: 0.3s;
        }

        .login-link:hover b {
            color: white;
        }

        .error {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            font-size: 14px;
            border: 1px solid rgba(255, 59, 48, 0.2);
        }
        
        /* -------- Mobile Optimizations -------- */
        @media (max-width: 480px) {
            .signup-container {
                padding: 35px 20px;
                border-radius: 24px;
            }

            .logo-text {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="brand-header">
            <h2>Join the Nest</h2>
            <span class="logo-text">FluentNest</span>
        </div>

        <form th:action="@{/signup}" method="post" th:object="${user}">
            <input type="text" placeholder="Choose Username" th:field="*{username}" required />
            <input type="password" placeholder="Create Password" th:field="*{password}" required />
            <button type="submit">Create Account</button>
        </form>

        <a href="/login" class="login-link">Already a member? <b>Login here</b></a>

        <div class="error" th:if="${error}" th:text="${error}"></div>
    </div>
</body>
</html>
