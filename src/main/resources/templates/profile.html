<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile | FluentNest</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #4EB5A9 0%, #0a001a 35%, #0a001a 70%, #7928ca 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            padding: 20px 0;
        }

        /* Glass card enhancement */
        .profile-card {
            max-width: 700px;
            margin: 40px auto;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        /* Profile image with glow */
        .profile-img-container {
            position: relative;
            display: inline-block;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #4EB5A9;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(78, 181, 169, 0.3);
        }

        /* Modern Glass Fields */
        .profile-item {
            margin-bottom: 1.5rem;
        }

        .profile-value {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 18px;
            color: #e0e0e0;
            font-weight: 400;
            transition: 0.3s;
        }

        .profile-value:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(78, 181, 169, 0.5);
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #4EB5A9;
            display: block;
        }

        .section-title {
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #ffffff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Premium Edit button */
        .edit-btn {
            background: linear-gradient(135deg, #ff0080, #7928ca);
            border: none;
            border-radius: 14px;
            font-weight: 700;
            padding: 14px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(255, 0, 128, 0.2);
        }

        .edit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(255, 0, 128, 0.4);
            color: white;
            filter: brightness(1.1);
        }

        /* Responsive adjustments */
        @media (max-width: 576px) {
            .profile-card {
                padding: 25px 20px;
                margin: 20px 15px;
            }
            .profile-img {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="profile-card">
        <h2 class="text-center mb-4 section-title">Your Profile</h2>
       

        <div class="text-center mb-5">
            <div class="profile-img-container">
                <img th:src="${profile.profileImage != null ? profile.profileImage : '/images/default-avatar.png'}"
                     class="profile-img" alt="Profile Picture">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 profile-item">
                <label><i class="bi bi-person me-2"></i>Full Name</label>
                <div class="profile-value" th:text="${profile.name}">-</div>
            </div>

            <div class="col-md-6 profile-item">
                <label><i class="bi bi-translate me-2"></i>Native Language</label>
                <div class="profile-value" th:text="${profile.nativeLanguage}">-</div>
            </div>

            <div class="col-md-6 profile-item">
                <label><i class="bi bi-bar-chart me-2"></i>English Level</label>
                <div class="profile-value" th:text="${profile.englishLevel}">-</div>
            </div>

            <div class="col-md-6 profile-item">
                <label><i class="bi bi-chat-dots me-2"></i>Practice Languages</label>
                <div class="profile-value" th:text="${profile.practiceLanguages}">-</div>
            </div>

            <div class="col-md-6 profile-item">
                <label><i class="bi bi-briefcase me-2"></i>Profession / Study</label>
                <div class="profile-value" th:text="${profile.profession}">-</div>
            </div>

            <div class="col-md-6 profile-item">
                <label><i class="bi bi-clock me-2"></i>Availability</label>
                <div class="profile-value" th:text="${profile.availability}">-</div>
            </div>

            <div class="col-12 profile-item">
                <label><i class="bi bi-lightbulb me-2"></i>Favorite Topics</label>
                <div class="profile-value" th:text="${profile.favoriteTopics}">-</div>
            </div>

            <div class="col-12 profile-item">
                <label><i class="bi bi-trophy me-2"></i>Goals</label>
                <div class="profile-value" th:text="${profile.goals}">-</div>
            </div>
        </div>

        <div class="row g-3 mt-4">
        <div class="col-md-6">
            <a th:href="@{/profile/edit}" class="btn edit-btn w-100">
                <i class="bi bi-pencil-square me-2"></i>Edit Profile
            </a>
        </div>
        <div class="col-md-6">
            <a href="/" class="btn w-100" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 14px; padding: 14px; font-weight: 700;">
                <i class="bi bi-house-door me-2"></i>Go to Home
            </a>
        </div>
    </div>
    </div>
</div>

</body>
</html>
