<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fluency Challenge | FluentNest</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

    :root {
      --primary: #4EB5A9;
      --accent: #7928ca;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: linear-gradient(135deg, #4EB5A9 0%, #0a001a 50%, #6157E1 100%);
      background-attachment: fixed;
      margin: 0; 
      padding: 15px; 
      color: white; 
      min-height: 100vh;
    }
    
    header {
      text-align: center; 
      padding: 60px 20px; 
      margin-bottom: 20px;
    }

    header h1 {
        font-weight: 800;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        letter-spacing: -1px;
        margin-bottom: 10px;
    }

    main { 
        max-width: 1100px; 
        margin: 0 auto; 
        display: grid; 
        grid-template-columns: 2fr 1fr; 
        gap: 25px; 
    }

    .card { 
        background: var(--glass); 
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 24px; 
        padding: 30px; 
        box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
    }

    .prompt-box { 
        background: rgba(78, 181, 169, 0.1); 
        padding: 25px; 
        border-radius: 18px; 
        border-left: 5px solid var(--primary); 
        margin: 25px 0; 
        font-weight: 600;
        font-size: 1.1rem;
        color: #e0e0e0;
    }

    .timer-display { 
        font-size: 28px; 
        font-weight: 800; 
        color: var(--primary); 
        text-align: center; 
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(78, 181, 169, 0.3);
    }

    input, select, textarea {
      width: 100%; 
      padding: 14px; 
      margin: 8px 0 15px; 
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-family: inherit;
      box-sizing: border-box;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.12);
    }

    textarea {
        height: 180px;
        resize: none;
    }

    .btn {
      padding: 14px 25px; 
      border-radius: 14px; 
      border: none; 
      font-weight: 700;
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .btn-main { 
        background: linear-gradient(135deg, #ff0080, #7928ca); 
        color: white; 
        width: 100%; 
        box-shadow: 0 10px 20px rgba(255, 0, 128, 0.2);
    }

    .btn-main:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(255, 0, 128, 0.4);
    }

    .btn-ghost { 
        background: rgba(255, 255, 255, 0.1); 
        color: white; 
        border: 1px solid var(--glass-border);
    }

    .btn-ghost:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.2);
    }

    .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    
    .result-popup { 
        background: rgba(78, 181, 169, 0.15); 
        border: 1px solid var(--primary); 
        padding: 20px; 
        border-radius: 18px; 
        margin-top: 25px; 
        display: none; 
        text-align: center;
        animation: slideIn 0.4s ease;
    }

    @media (max-width: 850px) {
      main { grid-template-columns: 1fr; }
      header { padding: 40px 15px; }
    }

    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<header>
  <h1>Speak & Type Challenge</h1>
  <p class="opacity-75">Test your fluency and climb the leaderboard!</p>
</header>

<main>
  <section class="card">
    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 150px;">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--primary);">DIFFICULTY</label>
            <select id="difficulty">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate" selected>Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </div>
        <div style="width: 120px;">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--primary);">SECONDS</label>
            <input type="number" id="duration" value="60">
        </div>
    </div>

    <div class="prompt-box" id="promptText">Choose difficulty and hit Start!</div>
    
    <div class="timer-display"><i class="fa-regular fa-clock me-2"></i><span id="timeLeft">--</span>s</div>

    <div style="display: flex; gap: 12px; margin-bottom: 25px;">
        <button id="startBtn" class="btn btn-main">Start Challenge</button>
        <button id="submitBtn" class="btn btn-ghost" disabled>Finish Now</button>
    </div>

    <textarea id="response" placeholder="Type your summary here as you speak..." disabled></textarea>

    <div id="resultArea" class="result-popup"></div>
  </section>

  <aside>
    <div class="card">
        <h3 style="margin-top: 0; font-size: 1.1rem;"><i class="fa-solid fa-trophy me-2 text-warning"></i> Save Progress</h3>
        <p class="small opacity-50 mb-4">Your score will be recorded on the global wall of fame.</p>
        
        <label style="font-size: 0.75rem; font-weight: 700; color: var(--primary);">PLAYER NAME</label>
        <input type="text" id="playerName" placeholder="Your username">
        
        <button id="saveScore" class="btn btn-main" disabled style="margin-bottom: 12px; width: 100%;">Save Score</button>
        <a th:href="@{/leaderboard}" class="btn btn-ghost" style="width: 100%; box-sizing: border-box;">
            <i class="fa-solid fa-ranking-star"></i> Leaderboard
        </a>
    </div>
  </aside>
</main>

<script>
    const prompts = {
        Beginner: ["Your favorite food.", "Describe your room.", "Your last holiday."],
        Intermediate: ["Importance of exercise.", "Pros of social media.", "Describe your dream job."],
        Advanced: ["Climate change solutions.", "AI in healthcare.", "Universal Basic Income."]
    };

    let timer, timeRemaining, started = false, lastScore = null;

    const startBtn = document.getElementById('startBtn');
    const submitBtn = document.getElementById('submitBtn');
    const responseEl = document.getElementById('response');
    const timeLeftEl = document.getElementById('timeLeft');
    const resultArea = document.getElementById('resultArea');
    const saveBtn = document.getElementById('saveScore');

    startBtn.onclick = () => {
        const diff = document.getElementById('difficulty').value;
        document.getElementById('promptText').innerText = prompts[diff][Math.floor(Math.random()*3)];
        
        timeRemaining = parseInt(document.getElementById('duration').value) || 60;
        timeLeftEl.innerText = timeRemaining;
        
        responseEl.disabled = false;
        responseEl.value = "";
        responseEl.focus();
        
        startBtn.disabled = true;
        submitBtn.disabled = false;
        saveBtn.disabled = true;
        resultArea.style.display = 'none';
        started = true;

        timer = setInterval(() => {
            timeRemaining--;
            timeLeftEl.innerText = timeRemaining;
            if (timeRemaining <= 0) finish();
        }, 1000);
    };

    submitBtn.onclick = finish;

    function finish() {
        started = false;
        clearInterval(timer);
        startBtn.disabled = false;
        submitBtn.disabled = true;
        responseEl.disabled = true;

        const words = responseEl.value.trim().split(/\s+/).filter(x => x).length;
        const totalTime = parseInt(document.getElementById('duration').value);
        const wpm = Math.round(words / (totalTime / 60));

        lastScore = {
            name: document.getElementById('playerName').value || "Guest",
            difficulty: document.getElementById('difficulty').value,
            wpm: wpm,
            words: words,
            duration: totalTime,
            date: new Date().toISOString()
        };

        resultArea.style.display = 'block';
        resultArea.innerHTML = `<i class="fa-solid fa-circle-check fs-4 mb-2"></i><br><strong>Excellent!</strong> You typed ${words} words at <strong>${wpm} WPM</strong>.`;
        saveBtn.disabled = false;
    }

    saveBtn.onclick = () => {
        const scores = JSON.parse(localStorage.getItem('fluent_challenge_scores') || '[]');
        scores.push(lastScore);
        scores.sort((a, b) => b.wpm - a.wpm);
        localStorage.setItem('fluent_challenge_scores', JSON.stringify(scores));
        alert("Score saved! Go check the leaderboard.");
        saveBtn.disabled = true;
    };
</script>
</body>
</html>
