<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocabulary Practice | FluentNest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary:#7928ca; --secondary:#4A1780; --accent: #00d1b2; 
            --bg: #f8f9fd; --card-bg: #ffffff; --text: #2D3748; --border: #edf2f7;
        }

        [data-theme="dark"] {
            --bg: #1a202c; --card-bg: #2d3748; --text: #f7fafc; --border: #4a5568;
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body { font-family:'Poppins',sans-serif; background: var(--bg); margin:0; color: var(--text); overflow-x: hidden; }
        
        header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; text-align:center; padding: 50px 20px 70px; }
        
        .nav-container { max-width: 1200px; margin: -30px auto 0; padding: 0 15px; }
        .nav-bar { 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 18px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        .controls-group { display: flex; gap: 10px; align-items: center; }

        .icon-btn {
            background: none; border: 1px solid var(--border); font-size: 1rem; cursor: pointer;
            color: var(--primary); width: 35px; height: 35px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .search-wrapper { position: relative; width: 100%; }
        .search-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #a0aec0; }
        .search-input {
            width: 100%; padding: 12px 15px 12px 45px; border-radius: 12px;
            border: 2px solid var(--border); background: var(--bg); color: var(--text);
            font-size: 16px; outline: none;
        }

        .stat-pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px; font-weight: 700; background: rgba(255, 152, 0, 0.1); color: #ff9800; border: 1px solid #ffe082; }
        
        .container { max-width:1200px; margin: 30px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 25px; }
        
        .leaderboard-card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--border); }
        .leader-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        
        .flashcards { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 18px; border: 1px solid var(--border); text-align: center; }
        .word { font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
        
        .meaning { 
            font-size: 0.9rem; opacity: 0.8; line-height: 1.4; margin-bottom: 15px; 
            padding: 10px; background: rgba(0,0,0,0.03); border-radius: 8px;
        }
        .hidden-meaning { filter: blur(5px); user-select: none; pointer-events: none; }

        .test-action-btn { 
            background: none; border: 1px dashed var(--primary); color: var(--primary);
            padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; margin-bottom: 10px;
        }
        
        .learn-btn { width:100%; padding:12px; border:none; border-radius:12px; background: var(--primary); color:white; font-weight:600; cursor:pointer; }
        .learn-btn.disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        .learn-btn.learned { background: var(--border); color: #a0aec0; }

        @media (min-width: 768px) {
            .nav-bar { flex-direction: row; padding: 12px 25px; }
            .container { display: grid; grid-template-columns: 1fr 320px; align-items: start; }
            .flashcards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
            .leaderboard-card { position: sticky; top: 20px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Vocabulary Builder</h1>
    <p>Practice makes perfect. Reach the top! 🏆</p>
</header>

<div class="nav-container">
    <div class="nav-bar">
        <div class="nav-top-row">
            <a href="/" style="color:var(--primary); text-decoration:none; font-weight:700;"><i class="fa-solid fa-house"></i> Home</a>
            <div class="controls-group">
                <button class="icon-btn" id="testModeBtn" onclick="toggleTestMode()" title="Flashcard Mode">
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
                <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <div class="stat-pill"><i class="fa-solid fa-star"></i> <span id="userXpDisplay">0</span> XP</div>
            </div>
        </div>
        
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="search-input" id="wordSearch" placeholder="Search words..." onkeyup="filterWords()">
        </div>
    </div>
</div>

<div class="container">
    <aside class="leaderboard-card">
        <h3 style="margin:0 0 15px; font-size: 1.1rem;"><i class="fa-solid fa-trophy" style="color:gold"></i> Rankings</h3>
        <div id="leaderboardList" style="font-size: 0.9rem;">Loading...</div>
    </aside>

    <section>
        <div class="flashcards" id="flashcards"></div>
    </section>
</div>

<script th:inline="javascript">
    const loggedInUser = /*[[${#authentication.name}]]*/ "Guest";
    let isTestMode = false;

    const words = [
        { id: 1, word: "Adapt", meaning: "To adjust to new conditions.", xp: 10 },
        { id: 2, word: "Eloquent", meaning: "Fluent or persuasive in speaking.", xp: 15 },
        { id: 3, word: "Resilient", meaning: "Recovering quickly from difficulties.", xp: 15 },
        { id: 4, word: "Pragmatic", meaning: "Practical and realistic approach.", xp: 10 },
        { id: 5, word: "Diligent", meaning: "Showing care in one's work.", xp: 15 },
        { id: 6, word: "Vibrant", meaning: "Full of energy and life.", xp: 10 },
        { id: 7, word: "Meticulous", meaning: "Showing great attention to detail.", xp: 20 },
        { id: 8, word: "Candid", meaning: "Truthful and straightforward.", xp: 10 }
    ];

    // Theme & Mode Logic
    function toggleTheme() {
        const targetTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', targetTheme);
        localStorage.setItem('theme', targetTheme);
        document.querySelector('#themeBtn i').className = targetTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    function toggleTestMode() {
        isTestMode = !isTestMode;
        document.getElementById('testModeBtn').classList.toggle('active');
        renderWords(words);
    }

    function revealMeaning(btn, id) {
        document.getElementById(`meaning-${id}`).classList.remove('hidden-meaning');
        document.getElementById(`learn-btn-${id}`).classList.remove('disabled');
        btn.style.display = 'none';
    }

    // Standard Logic
    async function fetchLeaderboard() {
        try {
            const response = await fetch('/api/leaderboard');
            const users = await response.json();
            renderLeaderboard(users);
        } catch (err) { console.error(err); }
    }

    function renderLeaderboard(users) {
        const list = document.getElementById('leaderboardList');
        users.sort((a, b) => b.xp - a.xp);
        list.innerHTML = users.map((u, i) => `
            <div class="leader-item">
                <span>${i+1}. <strong>${u.username === loggedInUser ? 'You' : u.username}</strong></span>
                <span style="color:var(--primary); font-weight:700">${u.xp} XP</span>
            </div>
        `).join('');
        const me = users.find(u => u.username === loggedInUser);
        if(me) document.getElementById('userXpDisplay').innerText = me.xp;
    }

    async function learnWord(btn, xpValue) {
        if (btn.classList.contains('learned') || btn.classList.contains('disabled')) return;
        try {
            const response = await fetch('/api/user/update-xp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ xpValue: xpValue })
            });
            if (response.ok) {
                btn.classList.add('learned');
                btn.innerHTML = 'Learned';
                fetchLeaderboard();
            }
        } catch (err) { console.error(err); }
    }

    function filterWords() {
        const query = document.getElementById('wordSearch').value.toLowerCase();
        renderWords(words.filter(w => w.word.toLowerCase().includes(query)));
    }

    function renderWords(items) {
        document.getElementById('flashcards').innerHTML = items.map(w => `
            <div class="card">
                <div class="word">${w.word}</div>
                <div id="meaning-${w.id}" class="meaning ${isTestMode ? 'hidden-meaning' : ''}">${w.meaning}</div>
                ${isTestMode ? `<button class="test-action-btn" onclick="revealMeaning(this, ${w.id})">Show Meaning</button>` : ''}
                <button id="learn-btn-${w.id}" class="learn-btn ${isTestMode ? 'disabled' : ''}" onclick="learnWord(this, ${w.xp})">Learn +${w.xp} XP</button>
            </div>
        `).join('');
    }

    // Initialization
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.querySelector('#themeBtn i').className = savedTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';

    window.onload = () => { renderWords(words); fetchLeaderboard(); };
</script>
</body>
</html>
