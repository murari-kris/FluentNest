# Use the port assigned by the cloud provider, or 8089 for local testing
server.port=${PORT:8089}

# Database Configuration
# These variables will be filled by Render/AWS/TiDB later
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/login_page?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:MyStrongPass@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false   

# Logging and WebSockets
logging.level.org.hibernate.SQL=DEBUG
spring.websocket.server.max-text-message-size=65536
spring.websocket.server.max-binary-message-size=65536